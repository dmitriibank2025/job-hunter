services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job_hunter_db
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_hunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d job_hunter"]
        interval: 10s
        timeout: 5s
        retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: "false"
    container_name: job-hunter-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_hunter
    command: ["sh", "-c", "pnpm prisma migrate deploy"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PLAYWRIGHT: ${INSTALL_PLAYWRIGHT:-false}
    container_name: job-hunter-backend
    restart: always
    ports:
      - "4000:4000"
      - "6080:6080"   # noVNC remote browser for LinkedIn login
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.example
    environment:
        NODE_ENV: development
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/job_hunter
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        PORT: 4000
        STORAGE_DIR: /app/storage
        TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
        TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
        ATS_RESUME_MIN_SCORE: ${ATS_RESUME_MIN_SCORE:-75}
        ATS_RESUME_ENFORCE: ${ATS_RESUME_ENFORCE:-false}
        MIN_MATCH_SCORE: ${MIN_MATCH_SCORE:-70}
        JOB_SEARCH_EXCLUDED_KEYWORDS: ${JOB_SEARCH_EXCLUDED_KEYWORDS:-}
        JOB_REPORT_CRON: ${JOB_REPORT_CRON:-0 9 * * *}
        JOB_REPORT_TIMEZONE: ${JOB_REPORT_TIMEZONE:-Asia/Jerusalem}
        JOB_REPORT_LIMIT: ${JOB_REPORT_LIMIT:-20}
        DAILY_JOB_REPORT_ENABLED: ${DAILY_JOB_REPORT_ENABLED:-true}
        JOB_SEARCH_KEYWORDS: full stack developer,backend developer,node.js typescript,react node.js aws
        LINKEDIN_SEARCH_URLS: ${LINKEDIN_SEARCH_URLS:-https://www.linkedin.com/jobs/search,https://www.linkedin.com/jobs/collections/top-applicant/}
        LINKEDIN_STORAGE_STATE: storage/linkedin_auth.json
        LINKEDIN_RECOMMENDED_OUTPUT: storage/linkedin_recommended_jobs.json
        LINKEDIN_HEADLESS: "true"
        LINKEDIN_CONNECT_HEADLESS: "true"
        LINKEDIN_CONNECT_BROWSER_CHANNEL: ""
        LINKEDIN_AUTH_TIMEOUT_MS: ${LINKEDIN_AUTH_TIMEOUT_MS:-300000}
        LINKEDIN_EMAIL: ${LINKEDIN_EMAIL:-}
        LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD:-}
        # Per-user interactive LinkedIn login via noVNC remote browser
        LINKEDIN_REMOTE_VIEW: ${LINKEDIN_REMOTE_VIEW:-true}
        PUBLIC_NOVNC_BASE: ${PUBLIC_NOVNC_BASE:-http://localhost:6080}
        PROVIDER_BROWSER_TIMEOUT_MS: ${PROVIDER_BROWSER_TIMEOUT_MS:-360000}
        PROVIDER_PAGE_TIMEOUT_MS: ${PROVIDER_PAGE_TIMEOUT_MS:-20000}
        PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-300000}
        PROVIDER_FETCH_DETAILS: ${PROVIDER_FETCH_DETAILS:-false}
        ACTIVE_PROVIDERS: ${ACTIVE_PROVIDERS:-LINKEDIN,GREENHOUSE,LEVER,ASHBY,COMEET,WORKABLE,DEVJOBS,ALLJOBS,DRUSHIM,JOBMASTER,GOTFRIENDS,SQLINK,NISHA,JOBIFY,EMPLOYBL}
        JOB_FILTER_DEBUG: ${JOB_FILTER_DEBUG:-false}
        PUBLIC_BOARD_MAX_DETAIL_PAGES: ${PUBLIC_BOARD_MAX_DETAIL_PAGES:-15}
        DRUSHIM_MAX_DETAIL_PAGES: ${DRUSHIM_MAX_DETAIL_PAGES:-12}
        ALLJOBS_MAX_DETAIL_PAGES: ${ALLJOBS_MAX_DETAIL_PAGES:-10}
        GOTFRIENDS_MAX_DETAIL_PAGES: ${GOTFRIENDS_MAX_DETAIL_PAGES:-15}
        SQLINK_MAX_DETAIL_PAGES: ${SQLINK_MAX_DETAIL_PAGES:-12}
        GREENHOUSE_BOARD_TOKENS: ${GREENHOUSE_BOARD_TOKENS:-}
        LEVER_SITES: ${LEVER_SITES:-}
        ASHBY_JOB_BOARDS: ${ASHBY_JOB_BOARDS:-}
        COMEET_ACCOUNTS: ${COMEET_ACCOUNTS:-}
        WORKABLE_ACCOUNTS: ${WORKABLE_ACCOUNTS:-Nuvei|nuvei}
        DEVJOBS_SEARCH_URLS: ${DEVJOBS_SEARCH_URLS:-https://devjobs.co.il/jobs-grid}
        JOBMASTER_SEARCH_URLS: ${JOBMASTER_SEARCH_URLS:-https://www.jobmaster.co.il/jobs/q-Full-Stack-Developer/;https://www.jobmaster.co.il/jobs/q-Backend-Developer/;https://www.jobmaster.co.il/jobs/q-Frontend-Developer/}
        ETHOSIA_SEARCH_URLS: ${ETHOSIA_SEARCH_URLS:-}
        NISHA_SEARCH_URLS: ${NISHA_SEARCH_URLS:-https://www.nisha.co.il/job_cat/high-tech/}
        JOBIFY_SEARCH_URLS: ${JOBIFY_SEARCH_URLS:-https://jobify.run/jobs?country=IL&tags=TypeScript}
        EMPLOYBL_SEARCH_URLS: ${EMPLOYBL_SEARCH_URLS:-https://www.employbl.com/jobs}
        GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
        GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
        GMAIL_USER_ID: ${GMAIL_USER_ID:-me}
        GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:4000/oauth/google/callback}
        EMAIL_REPORT_ENABLED: ${EMAIL_REPORT_ENABLED:-true}
        GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
    volumes:
      - ./storage:/app/storage

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: job-hunter-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      JOB_HUNTER_API_BASE_URL: http://localhost:4000

volumes:
  postgres_data:
